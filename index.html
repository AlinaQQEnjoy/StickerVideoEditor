<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贴纸音频峰值剪辑</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>贴纸音频峰值剪辑</h1>
        <p id="statusText">Ready.</p>
      </div>
      <div class="actions">
        <button id="selectAllBtn" type="button">全选</button>
        <button id="selectNoneBtn" type="button">清空</button>
        <button id="exportBtn" type="button" class="primary">导出成品</button>
      </div>
    </section>

    <section class="controls">
      <label class="field wide">
        <span>原视频路径</span>
        <input id="inputVideo" value="D:\MellowScape\原视频\IMG_4833.MOV">
      </label>
      <label class="field">
        <span>峰值阈值 dBFS</span>
        <input id="thresholdDbfs" type="number" value="-20" step="1">
      </label>
      <label class="field">
        <span>峰值前截取</span>
        <input id="preRoll" type="number" value="0.4" step="0.05">
      </label>
      <label class="field">
        <span>峰值后截取</span>
        <input id="postRoll" type="number" value="0.4" step="0.05">
      </label>
      <label class="field">
        <span>最小峰值间隔</span>
        <input id="minGap" type="number" value="0.3" step="0.05">
      </label>
      <label class="field">
        <span>最多片段</span>
        <input id="maxPeaks" type="number" value="300" step="1">
      </label>
      <button id="analyzeBtn" type="button" class="primary">识别音频峰值</button>
    </section>

    <section class="summary">
      <div><strong id="countText">0</strong><span>片段</span></div>
      <div><strong id="selectedText">0</strong><span>已选</span></div>
      <div class="output" id="outputText"></div>
    </section>

    <section id="grid" class="grid"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
